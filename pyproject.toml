[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "math2-pack"
version = "1.0.0"
description = "Offline file workflow for Math II training inside ChatGPT web"
requires-python = ">=3.11"
dependencies = ["sympy==1.14.0", "jsonschema==4.23.0"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
math2-pack = "math2_pack.__main__:main"

[tool.setuptools]
packages = ["math2_pack"]

[tool.setuptools.data-files]
"share/math2_pack/prompts" = ["prompts/*.md"]
"share/math2_pack/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests_file"]
norecursedirs = ["external_unmodified", "inputs", ".venv", "data", "dist"]
addopts = "-ra"

